{% extends 'base.html' %}
{% block title %}Checkout - Ecomers{% endblock %}
{% block content %}
<h2>Checkout</h2>
<p>This is a template checkout page. Integrate payments later.</p>
<form>
  <div class="grid">
    <label>
      Full name
      <input name="full_name" required />
    </label>
    <label>
      Email
      <input type="email" name="email" required />
    </label>
  </div>
  <label>
    Address
    <input name="address" required />
  </label>
  <div class="grid">
    <label>
      City
      <input name="city" required />
    </label>
    <label>
      Postal code
      <input name="postal_code" required />
    </label>
  </div>
  <button type="submit">Place order</button>
  <a href="/cart/" role="button" class="secondary">Back to cart</a>
</form>
{% endblock %}
